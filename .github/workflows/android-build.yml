# =============================================================================
# Carsai Mozambique - Android Build Workflow
# =============================================================================
# Triggers on push to main and on tag push (v*).
# Builds APK and AAB with Capacitor + Gradle, signs with keystore,
# and uploads as GitHub artifacts.
# =============================================================================

name: Android Build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

env:
  JAVA_VERSION: '17'

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Build Android APK + AAB
  # ---------------------------------------------------------------------------
  build-android:
    name: Build Android APK & AAB
    runs-on: ubuntu-latest

    steps:
      # -----------------------------------------------------------------------
      # Setup
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle wrapper dependencies
        run: |
          # Accept all Android SDK licenses
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          # Install required SDK components
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true

      # -----------------------------------------------------------------------
      # Install & Database
      # -----------------------------------------------------------------------
      - name: Install dependencies
        run: bun install

      - name: Setup database
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          bun run db:generate

      # -----------------------------------------------------------------------
      # Static Export (for Capacitor)
      # -----------------------------------------------------------------------
      - name: Create export script
        run: |
          mkdir -p scripts
          cat > scripts/export.sh << 'EXPORT_SCRIPT'
          #!/bin/bash
          set -e
          
          CONFIG_FILE="next.config.ts"
          
          # Backup original config
          cp "$CONFIG_FILE" "${CONFIG_FILE}.bak"
          
          # Trap to restore on exit (even on error)
          trap 'mv "${CONFIG_FILE}.bak" "$CONFIG_FILE"; if [ -d "src/app/api.bak" ]; then rm -rf src/app/api; mv src/app/api.bak src/app/api; fi; find src/app -type d -name "*.slug.bak" | while read d; do mv "$d" "${d%.bak}"; done' EXIT
          
          # Remove API routes (they don't work with static export)
          if [ -d "src/app/api" ]; then
            mv src/app/api src/app/api.bak
          fi
          
          # Remove [slug] dynamic routes (they require server-side rendering)
          find src/app -type d -name '\[*\]' | while read dir; do
            backup_dir="${dir}.bak"
            mv "$dir" "$backup_dir"
          done
          
          # Change output to "export"
          sed -i 's/output: "standalone"/output: "export"/' "$CONFIG_FILE"
          
          # Build
          bun run build
          
          echo "✅ Static export completed successfully"
          EXPORT_SCRIPT
          chmod +x scripts/export.sh

      - name: Run static export
        run: bash scripts/export.sh

      # -----------------------------------------------------------------------
      # Capacitor Setup
      # -----------------------------------------------------------------------
      - name: Initialize Capacitor
        run: |
          bunx cap init com.carsaimz CarsaiMZ --web-dir out || true

      - name: Add Android platform
        run: bunx cap add android || true

      - name: Sync Capacitor
        run: bunx cap sync android

      - name: Copy web assets
        run: bunx cap copy android

      # -----------------------------------------------------------------------
      # AndroidManifest.xml Configuration
      # -----------------------------------------------------------------------
      - name: Configure AndroidManifest.xml with all permissions and features
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          
          # Ensure the manifest file exists
          if [ ! -f "$MANIFEST" ]; then
            echo "⚠️ AndroidManifest.xml not found, creating a new one..."
            mkdir -p android/app/src/main
            cat > "$MANIFEST" << 'MANIFEST_BASE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">
          
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="true"
                  android:networkSecurityConfig="@xml/network_security_config"
                  tools:targetApi="31">
          
                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:theme="@style/AppTheme.NoActionBar"
                      android:windowSoftInputMode="adjustResize">
          
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          MANIFEST_BASE
          fi
          
          # -----------------------------------------------------------------------
          # Insert all permissions BEFORE the <application> tag
          # -----------------------------------------------------------------------
          PERMS_BLOCK='
              <!-- ============================================================= -->
              <!-- Network Permissions -->
              <!-- ============================================================= -->
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
          
              <!-- ============================================================= -->
              <!-- Camera & Storage Permissions -->
              <!-- ============================================================= -->
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"
                  android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"
                  android:maxSdkVersion="29" />
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
          
              <!-- ============================================================= -->
              <!-- Hardware & Sensors -->
              <!-- ============================================================= -->
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.USE_BIOMETRIC" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
          
              <!-- ============================================================= -->
              <!-- Boot & Services -->
              <!-- ============================================================= -->
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />
          
              <!-- ============================================================= -->
              <!-- Notifications -->
              <!-- ============================================================= -->
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
          
              <!-- ============================================================= -->
              <!-- Shortcuts -->
              <!-- ============================================================= -->
              <uses-permission android:name="com.android.launcher.permission.INSTALL_SHORTCUT" />
              <uses-permission android:name="com.android.launcher.permission.UNINSTALL_SHORTCUT" />
          
              <!-- ============================================================= -->
              <!-- Location -->
              <!-- ============================================================= -->
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
          
              <!-- ============================================================= -->
              <!-- Google / Firebase / FCM -->
              <!-- ============================================================= -->
              <uses-permission android:name="com.google.android.c2dm.permission.RECEIVE" />
              <uses-permission android:name="com.google.android.providers.gsf.permission.READ_GSERVICES" />
              <uses-permission android:name="com.google.android.gms.permission.AD_ID" />
          
              <!-- ============================================================= -->
              <!-- NFC -->
              <!-- ============================================================= -->
              <uses-permission android:name="android.permission.NFC" />
          
              <!-- ============================================================= -->
              <!-- Bluetooth -->
              <!-- ============================================================= -->
              <uses-permission android:name="android.permission.BLUETOOTH"
                  android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN"
                  android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" />
          
              <!-- ============================================================= -->
              <!-- Hardware Features (uses-feature) -->
              <!-- ============================================================= -->
              <uses-feature android:name="android.hardware.camera"
                  android:required="false" />
              <uses-feature android:name="android.hardware.internet"
                  android:required="false" />
              <uses-feature android:name="android.hardware.location.gps"
                  android:required="false" />
              <uses-feature android:name="android.hardware.nfc"
                  android:required="false" />
              <uses-feature android:name="android.hardware.bluetooth"
                  android:required="false" />
          '
          
          # Insert the permissions block before the <application> tag
          sed -i "/<application/r /dev/stdin" "$MANIFEST" <<< "$PERMS_BLOCK"
          
          # Remove any duplicate permissions (in case Capacitor already added some)
          # We keep the first occurrence of each unique permission
          awk "!seen && /uses-permission.*android.permission.INTERNET/ { print; seen=1; next } !/uses-permission.*android.permission.INTERNET/" "$MANIFEST" > "${MANIFEST}.tmp" && mv "${MANIFEST}.tmp" "$MANIFEST"
          
          echo ""
          echo "=== Final AndroidManifest.xml ==="
          cat "$MANIFEST"
          echo ""
          echo "=== Manifest validation ==="
          # Verify key permissions are present
          for perm in INTERNET ACCESS_NETWORK_STATE CAMERA READ_MEDIA_IMAGES VIBRATE WAKE_LOCK FOREGROUND_SERVICE POST_NOTIFICATIONS ACCESS_FINE_LOCATION NFC BLUETOOTH_CONNECT; do
            if grep -q "android.permission.${perm}" "$MANIFEST"; then
              echo "✅ ${perm}"
            else
              echo "❌ ${perm} MISSING"
            fi
          done
          
          # Verify uses-features
          for feat in android.hardware.camera android.hardware.internet android.hardware.location.gps android.hardware.nfc android.hardware.bluetooth; do
            if grep -q "${feat}" "$MANIFEST"; then
              echo "✅ ${feat}"
            else
              echo "❌ ${feat} MISSING"
            fi
          done

      # -----------------------------------------------------------------------
      # Keystore & Signing
      # -----------------------------------------------------------------------
      - name: Setup keystore for signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Copy keystore to the Android app directory
          mkdir -p android/app/upload
          if [ -f "upload/release.jks" ]; then
            cp upload/release.jks android/app/upload/release.jks
            echo "✅ Keystore copied from upload/release.jks"
          else
            echo "⚠️ No keystore found at upload/release.jks — builds will be unsigned"
          fi
          
          # Create keystore properties file for Gradle
          cat > android/keystore.properties << KEYSTORE_PROPS
          storeFile=upload/release.jks
          storePassword=${KEYSTORE_PASSWORD}
          keyAlias=${KEYSTORE_ALIAS:-carsai}
          keyPassword=${KEY_PASSWORD}
          KEYSTORE_PROPS
          
          echo "✅ keystore.properties created"

      - name: Configure Gradle signing
        run: |
          # Modify the Android app's build.gradle to use the keystore properties
          BUILD_GRADLE="android/app/build.gradle"
          
          if [ -f "$BUILD_GRADLE" ]; then
            # Add keystore properties loading at the top of the android block
            if ! grep -q "keystoreProperties" "$BUILD_GRADLE"; then
              sed -i '/android {/i\def keystoreProperties = new Properties()\ndef keystorePropertiesFile = rootProject.file("keystore.properties")\nif (keystorePropertiesFile.exists()) {\n    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))\n}\n' "$BUILD_GRADLE"
            fi
            
            # Add signingConfigs block before buildTypes
            if ! grep -q "signingConfigs" "$BUILD_GRADLE"; then
              sed -i '/buildTypes {/i\    signingConfigs {\n        release {\n            keyAlias keystoreProperties[\"keyAlias\"]\n            keyPassword keystoreProperties[\"keyPassword\"]\n            storeFile keystoreProperties[\"storeFile\"] ? file(keystoreProperties[\"storeFile\"]) : null\n            storePassword keystoreProperties[\"storePassword\"]\n        }\n    }\n' "$BUILD_GRADLE"
            fi
            
            # Add signingConfig to release buildType
            if ! grep -q "signingConfig signingConfigs.release" "$BUILD_GRADLE"; then
              sed -i '/release {/a\            signingConfig signingConfigs.release' "$BUILD_GRADLE"
            fi
            
            echo "✅ Gradle signing configured"
          else
            echo "⚠️ build.gradle not found — skipping signing configuration"
          fi

      # -----------------------------------------------------------------------
      # Build APK & AAB
      # -----------------------------------------------------------------------
      - name: Build APK (Release)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Build AAB (Release)
        working-directory: android
        run: ./gradlew bundleRelease --stacktrace

      # -----------------------------------------------------------------------
      # Upload Artifacts
      # -----------------------------------------------------------------------
      - name: Prepare APK artifact
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/release/ -name "*.apk" -type f | head -1)
          if [ -n "$APK_PATH" ]; then
            echo "✅ Found APK: $APK_PATH"
            ls -lh "$APK_PATH"
            cp "$APK_PATH" CarsaiMozambique-release.apk
          else
            echo "❌ No APK found in build output"
            exit 1
          fi

      - name: Prepare AAB artifact
        run: |
          AAB_PATH=$(find android/app/build/outputs/bundle/release/ -name "*.aab" -type f | head -1)
          if [ -n "$AAB_PATH" ]; then
            echo "✅ Found AAB: $AAB_PATH"
            ls -lh "$AAB_PATH"
            cp "$AAB_PATH" CarsaiMozambique-release.aab
          else
            echo "❌ No AAB found in build output"
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-release
          path: CarsaiMozambique-release.apk
          retention-days: 30

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-aab-release
          path: CarsaiMozambique-release.aab
          retention-days: 30

      # -----------------------------------------------------------------------
      # Build Summary
      # -----------------------------------------------------------------------
      - name: Build Summary
        run: |
          echo "## 📱 Android Build Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Artifact | Size |" >> "$GITHUB_STEP_SUMMARY"
          echo "|:---------|-----:|" >> "$GITHUB_STEP_SUMMARY"
          
          APK_SIZE=$(du -h CarsaiMozambique-release.apk | cut -f1 | tr -d ' ')
          AAB_SIZE=$(du -h CarsaiMozambique-release.aab | cut -f1 | tr -d ' ')
          
          echo "| 📱 APK | ${APK_SIZE} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 📦 AAB | ${AAB_SIZE} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Commit:** \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Branch:** \`${{ github.ref_name }}\`" >> "$GITHUB_STEP_SUMMARY"
