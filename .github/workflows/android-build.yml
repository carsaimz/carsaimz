# =============================================================================
# Carsai Mozambique - Android Build Workflow
# =============================================================================
# Triggers on push to main and on tag push (v*).
# Builds APK and AAB with Capacitor + Gradle, signs with keystore,
# and uploads as GitHub artifacts.
# =============================================================================

name: Android Build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

env:
  JAVA_VERSION: '21'

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Build Android APK + AAB
  # ---------------------------------------------------------------------------
  build-android:
    name: Build Android APK & AAB
    runs-on: ubuntu-latest

    steps:
      # -----------------------------------------------------------------------
      # Setup
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle wrapper dependencies
        run: |
          # Accept all Android SDK licenses
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          # Install required SDK components
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" > /dev/null 2>&1 || true

      # -----------------------------------------------------------------------
      # Install
      # -----------------------------------------------------------------------
      - name: Install dependencies
        run: bun install

      # -----------------------------------------------------------------------
      # Static Export (for Capacitor)
      # -----------------------------------------------------------------------
      - name: Create export script
        run: |
          mkdir -p scripts
          cat > scripts/export.sh << 'EXPORT_SCRIPT'
          #!/bin/bash
          set -e
          
          # API routes are incompatible with output: "export" (no server in static sites).
          # The Capacitor app uses client-side Firestore directly, so API routes are not needed.
          # Dynamic [slug] routes also need generateStaticParams() which is problematic.
          # The Capacitor app handles navigation client-side via the store's selectedPostSlug/selectedTopicSlug.
          
          # Backup and remove API directory
          if [ -d "src/app/api" ]; then
            mv src/app/api /tmp/api_bak
            echo "API routes temporarily removed for static export"
          fi
          
          # Backup and remove dynamic [slug] routes
          for slug_dir in $(find src/app -type d -name '[slug]'); do
            mv "$slug_dir" "${slug_dir}.bak"
            echo "Dynamic route temporarily removed: $slug_dir"
          done
          
          # Build with BUILD_TARGET=capacitor for static export
          BUILD_TARGET=capacitor bun run build
          
          # Restore API directory
          if [ -d "/tmp/api_bak" ]; then
            mv /tmp/api_bak src/app/api
            echo "API routes restored"
          fi
          
          # Restore dynamic [slug] routes
          for bak_dir in $(find src/app -type d -name '[slug].bak'); do
            original="${bak_dir%.bak}"
            mv "$bak_dir" "$original"
            echo "Dynamic route restored: $original"
          done
          
          echo "Static export completed successfully"
          EXPORT_SCRIPT
          chmod +x scripts/export.sh

      - name: Run static export
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
          NEXT_PUBLIC_FIREBASE_VAPID_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_VAPID_KEY }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          FIREBASE_ADMIN_PROJECT_ID: ${{ secrets.FIREBASE_ADMIN_PROJECT_ID }}
          FIREBASE_ADMIN_CLIENT_EMAIL: ${{ secrets.FIREBASE_ADMIN_CLIENT_EMAIL }}
          FIREBASE_ADMIN_PRIVATE_KEY: ${{ secrets.FIREBASE_ADMIN_PRIVATE_KEY }}
        run: bash scripts/export.sh

      # -----------------------------------------------------------------------
      # Capacitor Setup
      # -----------------------------------------------------------------------
      - name: Initialize Capacitor
        run: |
          bunx cap init com.carsaimz CarsaiMZ --web-dir out || true

      - name: Add Android platform
        run: |
          # Add Android platform if not already present
          if [ -d "android" ]; then
            echo "Android platform already exists — skipping add"
          else
            bunx cap add android
            if [ ! -d "android" ]; then
              echo "Android platform failed to initialize"
              exit 1
            fi
            echo "Android platform added successfully"
          fi

      - name: Sync Capacitor
        run: bunx cap sync android

      - name: Copy web assets
        run: bunx cap copy android

      # -----------------------------------------------------------------------
      # AndroidManifest.xml Validation
      # -----------------------------------------------------------------------
      # The manifest is now maintained in the repo with all permissions included.
      # We only validate it here — no runtime sed patching.
      - name: Validate AndroidManifest.xml
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          
          if [ ! -f "$MANIFEST" ]; then
            echo "ERROR: AndroidManifest.xml not found"
            exit 1
          fi
          
          echo "=== AndroidManifest.xml ==="
          cat "$MANIFEST"
          echo ""
          echo "=== Manifest validation ==="
          # Verify key permissions are present
          for perm in INTERNET ACCESS_NETWORK_STATE CAMERA READ_MEDIA_IMAGES VIBRATE WAKE_LOCK FOREGROUND_SERVICE POST_NOTIFICATIONS ACCESS_FINE_LOCATION NFC BLUETOOTH_CONNECT; do
            if grep -q "android.permission.${perm}" "$MANIFEST"; then
              echo "OK: ${perm}"
            else
              echo "MISSING: ${perm}"
            fi
          done
          
          # Verify uses-features
          for feat in android.hardware.camera android.hardware.internet android.hardware.location.gps android.hardware.nfc android.hardware.bluetooth; do
            if grep -q "${feat}" "$MANIFEST"; then
              echo "OK: ${feat}"
            else
              echo "MISSING: ${feat}"
            fi
          done

      # -----------------------------------------------------------------------
      # Keystore & Signing
      # -----------------------------------------------------------------------
      # The KEYSTORE_FILE secret contains the base64-encoded keystore file.
      # Decode it and create keystore.properties for Gradle signing.
      # Without secrets, builds are unsigned (still valid for dev/testing).
      - name: Setup keystore for signing (if configured)
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # Only setup signing when ALL secrets are configured
          if [ -n "${KEYSTORE_FILE}" ] && [ -n "${KEYSTORE_PASSWORD}" ] && [ -n "${KEYSTORE_ALIAS}" ] && [ -n "${KEY_PASSWORD}" ]; then
            # Decode base64 keystore and place it where Gradle expects it
            mkdir -p android/app/upload
            echo "${KEYSTORE_FILE}" | base64 -d > android/app/upload/release.jks
            echo "Keystore decoded from KEYSTORE_FILE secret"
            
            # Create keystore properties file for Gradle
            printf 'storeFile=upload/release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "${KEYSTORE_PASSWORD}" "${KEYSTORE_ALIAS}" "${KEY_PASSWORD}" > android/keystore.properties
            
            echo "keystore.properties created — builds will be signed"
          else
            echo "Signing secrets not configured — builds will be unsigned (OK for dev/testing)"
          fi

      # -----------------------------------------------------------------------
      # Build APK & AAB
      # -----------------------------------------------------------------------
      - name: Build APK (Release)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Build AAB (Release)
        working-directory: android
        run: ./gradlew bundleRelease --stacktrace

      # -----------------------------------------------------------------------
      # Upload Artifacts
      # -----------------------------------------------------------------------
      - name: Prepare APK artifact
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/release/ -name "*.apk" -type f | head -1)
          if [ -n "$APK_PATH" ]; then
            echo "Found APK: $APK_PATH"
            ls -lh "$APK_PATH"
            cp "$APK_PATH" CarsaiMozambique-release.apk
          else
            echo "No APK found in build output"
            exit 1
          fi

      - name: Prepare AAB artifact
        run: |
          AAB_PATH=$(find android/app/build/outputs/bundle/release/ -name "*.aab" -type f | head -1)
          if [ -n "$AAB_PATH" ]; then
            echo "Found AAB: $AAB_PATH"
            ls -lh "$AAB_PATH"
            cp "$AAB_PATH" CarsaiMozambique-release.aab
          else
            echo "No AAB found in build output"
            exit 1
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk-release
          path: CarsaiMozambique-release.apk
          retention-days: 30

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-aab-release
          path: CarsaiMozambique-release.aab
          retention-days: 30

      # -----------------------------------------------------------------------
      # Build Summary
      # -----------------------------------------------------------------------
      - name: Build Summary
        run: |
          echo "## 📱 Android Build Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Artifact | Size |" >> "$GITHUB_STEP_SUMMARY"
          echo "|:---------|-----:|" >> "$GITHUB_STEP_SUMMARY"
          
          APK_SIZE=$(du -h CarsaiMozambique-release.apk | cut -f1 | tr -d ' ')
          AAB_SIZE=$(du -h CarsaiMozambique-release.aab | cut -f1 | tr -d ' ')
          
          echo "| 📱 APK | ${APK_SIZE} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 📦 AAB | ${AAB_SIZE} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Commit:** \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Branch:** \`${{ github.ref_name }}\`" >> "$GITHUB_STEP_SUMMARY"
