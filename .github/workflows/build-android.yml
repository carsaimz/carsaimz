name: Compilar Android (APK + AAB)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Tipo de build'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - apk
          - aab
      version:
        description: 'Versao (ex: v0.3.0)'
        required: false
        default: ''
  push:
    branches: [develop]
    paths:
      - 'src/**'
      - 'public/**'
      - 'prisma/**'
      - 'capacitor.config.ts'

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    name: Compilar APK/AAB

    steps:
      - name: Obter codigo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar dependencias
        run: bun install --frozen-lockfile

      - name: Gerar cliente Prisma
        run: bunx prisma generate

      # ── Icones ──
      - name: Gerar icones com @capacitor/assets
        run: |
          bun add -D @capacitor/assets
          mkdir -p assets
          cp public/logo.png assets/icon.png
          bunx capacitor-assets generate --android || true

      # ── Build Next.js (exportacao statica) ──
      - name: Compilar Next.js (exportacao statica)
        run: bun run export:clean
        env:
          NEXT_EXPORT_MODE: true
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      # ── Capacitor ──
      - name: Sincronizar Capacitor
        run: bunx cap sync android || true

      - name: Adicionar plataforma Android (se necessario)
        run: |
          if [ ! -d "android" ]; then
            bunx cap add android
          fi

      # ── Keystore ──
      - name: Copiar keystore
        run: |
          mkdir -p android/app
          cp upload/release.jks android/app/release.jks

      - name: Configurar assinatura Android
        working-directory: android
        run: |
          cat > app/sign.properties <<EOF
          storeFile=release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEYSTORE_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      # ── Build APK ──
      - name: Compilar APK (debug)
        if: ${{ inputs.build_type == 'both' || inputs.build_type == 'apk' || inputs.build_type == '' }}
        working-directory: android
        run: ./gradlew assembleDebug || true

      - name: Carregar APK como artifact
        if: ${{ inputs.build_type == 'both' || inputs.build_type == 'apk' || inputs.build_type == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: carsai-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      # ── Build AAB ──
      - name: Compilar AAB (release assinado)
        if: ${{ inputs.build_type == 'both' || inputs.build_type == 'aab' }}
        working-directory: android
        run: ./gradlew bundleRelease || true
        env:
          KEYSTORE_PATH: release.jks
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Carregar AAB como artifact
        if: ${{ inputs.build_type == 'both' || inputs.build_type == 'aab' }}
        uses: actions/upload-artifact@v4
        with:
          name: carsai-android-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 7

      # ── Limpeza ──
      - name: Limpar keystore
        if: always()
        run: |
          rm -f android/app/release.jks android/app/sign.properties
