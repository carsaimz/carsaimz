name: Empacotar Build Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    name: Compilar e Empacotar

    steps:
      - name: Obter codigo
        uses: actions/checkout@v4

      - name: Configurar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar dependencias
        run: bun install --frozen-lockfile

      - name: Gerar cliente Prisma
        run: bunx prisma generate

      - name: Compilar Next.js (modo standalone)
        run: bun run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Verificar resultado da compilacao
        run: |
          if [ ! -d ".next/standalone" ]; then
            echo "Erro: Diretorio standalone nao encontrado"
            exit 1
          fi
          echo "Compilacao verificada com sucesso"
          echo "Total de ficheiros:"
          find .next/standalone -type f | wc -l

      - name: Empacotar build como artifact
        uses: actions/upload-artifact@v4
        with:
          name: carsai-web-build-${{ github.sha }}
          path: .next/standalone/
          retention-days: 5

      - name: Sincronizar base de dados
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: bunx prisma db push || true
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
