# =============================================================================
# Carsai Mozambique - Windows Build Workflow
# =============================================================================
# Triggers on push to main and on tag push (v*).
# Builds a portable Windows EXE using Electron + electron-builder,
# and uploads as GitHub artifact.
#
# NOTE: The project uses output: "export" in next.config.ts for Android/Capacitor,
# but Electron requires output: "standalone". This workflow temporarily switches
# to standalone mode before building, then restores the original config.
# =============================================================================

name: Windows Build

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Build Windows Portable EXE
  # ---------------------------------------------------------------------------
  build-windows:
    name: Build Windows Portable EXE
    runs-on: windows-latest

    steps:
      # -----------------------------------------------------------------------
      # Setup
      # -----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # -----------------------------------------------------------------------
      # Install
      # -----------------------------------------------------------------------
      - name: Install dependencies
        run: bun install

      # -----------------------------------------------------------------------
      # Build Next.js Standalone (for Electron)
      # -----------------------------------------------------------------------
      - name: Run Next.js build (standalone for Electron)
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
          NEXT_PUBLIC_FIREBASE_VAPID_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_VAPID_KEY }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          FIREBASE_ADMIN_PROJECT_ID: ${{ secrets.FIREBASE_ADMIN_PROJECT_ID }}
          FIREBASE_ADMIN_CLIENT_EMAIL: ${{ secrets.FIREBASE_ADMIN_CLIENT_EMAIL }}
          FIREBASE_ADMIN_PRIVATE_KEY: ${{ secrets.FIREBASE_ADMIN_PRIVATE_KEY }}
        shell: pwsh
        run: |
          # No BUILD_TARGET set — builds in standard server mode (API routes work)
          try {
            bun run build
            Write-Host "Next.js build completed"
          } catch {
            Write-Host "Next.js build failed: $_"
            exit 1
          }

      - name: Verify standalone output and copy assets
        shell: pwsh
        run: |
          $standaloneDir = ".next\standalone"
          $standaloneServer = ".next\standalone\server.js"
          
          if (Test-Path $standaloneServer) {
            Write-Host "Standalone server.js found at $standaloneServer"
          } else {
            Write-Host "Standalone server.js NOT found — build may have failed"
            if (Test-Path $standaloneDir) {
              Get-ChildItem -Path $standaloneDir -Recurse -Depth 1 | Select-Object FullName
            } else {
              Write-Host ".next\standalone directory does not exist"
            }
            exit 1
          }
          
          # Copy static files into standalone directory
          $staticSource = ".next\static"
          $staticDest = ".next\standalone\.next\static"
          if (Test-Path $staticDest) {
            Write-Host "Static files already present in standalone"
          } else {
            if (Test-Path $staticSource) {
              Copy-Item -Path $staticSource -Destination $staticDest -Recurse -Force
              Write-Host "Static files copied to standalone"
            } else {
              Write-Host "Static files source not found"
            }
          }
          
          # Copy public directory into standalone
          $publicDest = ".next\standalone\public"
          if (Test-Path $publicDest) {
            Write-Host "Public directory already present in standalone"
          } else {
            if (Test-Path "public") {
              Copy-Item -Path "public" -Destination $publicDest -Recurse -Force
              Write-Host "Public directory copied to standalone"
            } else {
              Write-Host "Public directory not found"
            }
          }

      # -----------------------------------------------------------------------
      # Build Electron Portable EXE
      # -----------------------------------------------------------------------
      - name: Build Electron portable EXE
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          Write-Host "Running electron-builder for Windows portable..."
          bunx electron-builder --win portable
          
          Write-Host ""
          Write-Host "Build output:"
          if (Test-Path "dist") {
            Get-ChildItem -Path "dist" -Recurse | Select-Object FullName, Length
          } else {
            Write-Host "dist directory not found"
            exit 1
          }

      # -----------------------------------------------------------------------
      # Rename & Upload Artifact
      # -----------------------------------------------------------------------
      - name: Rename portable EXE
        shell: pwsh
        run: |
          # Find the portable EXE in the dist directory
          $exeFiles = Get-ChildItem -Path "dist" -Filter "*.exe" -Recurse
          
          if ($exeFiles.Count -eq 0) {
            Write-Host "No .exe files found in dist directory"
            exit 1
          }
          
          $portableExe = $exeFiles | Where-Object { $_.Name -notlike "*Setup*" } | Select-Object -First 1
          
          if ($portableExe) {
            $version = (Get-Content -Path "package.json" | ConvertFrom-Json).version
            $newName = "CarsaiMozambique-${version}-Portable.exe"
            Copy-Item -Path $portableExe.FullName -Destination $newName -Force
            Write-Host "Renamed: $($portableExe.Name) -> $newName"
            Write-Host "   Size: $([math]::Round($portableExe.Length / 1MB, 2)) MB"
          } else {
            Write-Host "No portable EXE found (only setup files?)"
            exit 1
          }

      - name: Upload Windows portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable-exe
          path: CarsaiMozambique-*-Portable.exe
          retention-days: 30

      # -----------------------------------------------------------------------
      # Build Summary
      # -----------------------------------------------------------------------
      - name: Build Summary
        shell: pwsh
        run: |
          $version = (Get-Content -Path "package.json" | ConvertFrom-Json).version
          $exeFile = Get-ChildItem -Path "." -Filter "CarsaiMozambique-*-Portable.exe"
          $exeSize = [math]::Round($exeFile.Length / 1MB, 2)
          
          $summary = @"
          ## 🖥️ Windows Build Summary
          
          | Artifact | Size |
          |:---------|-----:|
          | 💻 Portable EXE | ${exeSize} MB |
          
          **Version:** ``${version}``
          **Commit:** ``${{ github.sha }}``
          **Branch:** ``${{ github.ref_name }}``
          "@
          
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $summary
