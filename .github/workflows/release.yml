# =============================================================================
# Carsai Mozambique — Release Workflow
# =============================================================================
# Triggers:
#   1. Push to main → auto-increment build number (1.0.xxx), commit & tag,
#      build all platforms, create GitHub Release with changelog
#   2. workflow_dispatch → manual release with optional version input
#      (defaults to latest tag or package.json version)
#
# Versioning: MAJOR.MINOR.BUILD
#   - MAJOR.MINOR set via workflow_dispatch input or tag
#   - BUILD auto-incremented from GitHub run number (unique per run)
#   - Synced to package.json and capacitor.config.ts
#
# Builds: Web (standalone) + Android (APK + AAB) + Windows (Portable EXE)
# =============================================================================

name: Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.github/workflows/**'

  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.2.0) — leave empty to auto-increment build'
        required: false
        type: string
      prerelease:
        description: 'Mark as pre-release?'
        required: false
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  JAVA_VERSION: '21'

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # Bump version & generate changelog
  # ---------------------------------------------------------------------------
  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      previous_tag: ${{ steps.prev_tag.outputs.previous_tag }}
      changelog: ${{ steps.changelog.outputs.changelog }}
      is_prerelease: ${{ steps.bump.outputs.is_prerelease }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Get previous tag
        id: prev_tag
        run: |
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD 2>/dev/null || echo "")
          echo "previous_tag=${PREVIOUS_TAG}" >> "$GITHUB_OUTPUT"
          echo "Previous tag: ${PREVIOUS_TAG}"

      - name: Determine version
        id: bump
        run: |
          # Read current version from package.json
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          echo "Current package.json version: ${CURRENT_VERSION}"

          # Parse MAJOR.MINOR from current version
          MAJOR=$(echo "${CURRENT_VERSION}" | cut -d. -f1)
          MINOR=$(echo "${CURRENT_VERSION}" | cut -d. -f2)

          # Build number = GitHub run number (unique, always incrementing)
          BUILD="${{ github.run_number }}"

          if [ -n "${{ inputs.version }}" ]; then
            # Manual trigger with explicit version input
            INPUT_VERSION="${{ inputs.version }}"
            # Validate format (semver)
            if echo "${INPUT_VERSION}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              VERSION="${INPUT_VERSION}"
              # Re-parse MAJOR.MINOR from input for sync
              MAJOR=$(echo "${VERSION}" | cut -d. -f1)
              MINOR=$(echo "${VERSION}" | cut -d. -f2)
              BUILD=$(echo "${VERSION}" | cut -d. -f3)
            else
              echo "ERROR: Invalid version format '${INPUT_VERSION}'. Use MAJOR.MINOR.PATCH (e.g. 1.2.0)"
              exit 1
            fi
          else
            # Auto-increment: use MAJOR.MINOR from package.json + BUILD from run number
            VERSION="${MAJOR}.${MINOR}.${BUILD}"
          fi

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "major=${MAJOR}" >> "$GITHUB_OUTPUT"
          echo "minor=${MINOR}" >> "$GITHUB_OUTPUT"
          echo "build=${BUILD}" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=${{ inputs.prerelease || 'false' }}" >> "$GITHUB_OUTPUT"
          echo "New version: ${VERSION}"

      - name: Update package.json version
        run: |
          VERSION="${{ steps.bump.outputs.version }}"
          # Update version in package.json
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '${VERSION}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
          echo "Updated package.json to v${VERSION}"

      - name: Update capacitor.config.ts version
        run: |
          VERSION="${{ steps.bump.outputs.version }}"
          # capacitor.config.ts reads version from package.json via require('./package.json')
          # So it's already synced. But we also update the versionCode for Android.
          # The versionCode must be an integer (used by Google Play).
          MAJOR="${{ steps.bump.outputs.major }}"
          MINOR="${{ steps.bump.outputs.minor }}"
          BUILD="${{ steps.bump.outputs.build }}"
          # versionCode = MAJOR * 1000000 + MINOR * 1000 + BUILD
          VERSION_CODE=$(( MAJOR * 1000000 + MINOR * 1000 + BUILD ))
          echo "Android versionCode: ${VERSION_CODE}"

          # Update capacitor.config.ts to include versionCode
          if grep -q "versionCode" capacitor.config.ts; then
            sed -i "s/versionCode: [0-9]*/versionCode: ${VERSION_CODE}/" capacitor.config.ts
          else
            # Add versionCode after appName
            sed -i "s/appName: 'Carsai Mozambique',/appName: 'Carsai Mozambique',\n  versionCode: ${VERSION_CODE},/" capacitor.config.ts
          fi
          echo "Updated capacitor.config.ts with versionCode ${VERSION_CODE}"

      - name: Commit version bump
        run: |
          VERSION="${{ steps.bump.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json capacitor.config.ts
          git diff --cached --quiet || git commit -m "chore: bump version to v${VERSION}"
          git push

      - name: Create tag
        run: |
          VERSION="${{ steps.bump.outputs.version }}"
          TAG="v${VERSION}"
          # Check if tag already exists
          if git tag -l | grep -q "^${TAG}$"; then
            echo "Tag ${TAG} already exists — skipping"
          else
            git tag "${TAG}"
            git push origin "${TAG}"
            echo "Created tag ${TAG}"
          fi

      - name: Generate changelog
        id: changelog
        run: |
          PREVIOUS_TAG="${{ steps.prev_tag.outputs.previous_tag }}"

          if [ -n "${PREVIOUS_TAG}" ]; then
            LOG=$(git log ${PREVIOUS_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges)
          else
            LOG=$(git log --pretty=format:"- %s (%h)" --no-merges -30)
          fi

          # If no commits since last tag, use last 10 commits
          if [ -z "${LOG}" ]; then
            LOG=$(git log --pretty=format:"- %s (%h)" --no-merges -10)
          fi

          # Categorize commits
          FEATURES=$(echo "${LOG}" | grep -iE "feat|add|new" || true)
          FIXES=$(echo "${LOG}" | grep -iE "fix|patch|hotfix|repair" || true)
          CHORES=$(echo "${LOG}" | grep -iE "chore|build|ci|deps" || true)
          OTHER=$(echo "${LOG}" | grep -viE "feat|add|new|fix|patch|hotfix|repair|chore|build|ci|deps" || true)

          # Build formatted changelog
          cat > /tmp/changelog.txt << EOF
          ### What's New
          ${FEATURES:-_No new features in this release._}

          ### Bug Fixes
          ${FIXES:-_No bug fixes in this release._}

          ### Maintenance
          ${CHORES:-_No maintenance changes in this release._}

          ### Other Changes
          ${OTHER:-_No other changes._}
          EOF

          # Multi-line output via heredoc
          echo "changelog<<EOF" >> "$GITHUB_OUTPUT"
          cat /tmp/changelog.txt >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Build: Web (standalone Next.js server)
  # ---------------------------------------------------------------------------
  build-web:
    name: Build Web
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build Next.js standalone
        env:
          BUILD_TARGET: standalone
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
          NEXT_PUBLIC_FIREBASE_VAPID_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_VAPID_KEY }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          FIREBASE_ADMIN_PROJECT_ID: ${{ secrets.FIREBASE_ADMIN_PROJECT_ID }}
          FIREBASE_ADMIN_CLIENT_EMAIL: ${{ secrets.FIREBASE_ADMIN_CLIENT_EMAIL }}
          FIREBASE_ADMIN_PRIVATE_KEY: ${{ secrets.FIREBASE_ADMIN_PRIVATE_KEY }}
        run: bun run build

      - name: Verify standalone output
        run: |
          if [ -f ".next/standalone/server.js" ]; then
            echo "Standalone server.js found"
          else
            echo "Standalone server.js NOT found"
            exit 1
          fi

      - name: Package web artifact
        run: |
          cd .next/standalone
          tar -czf ../../carsaimz-web-${{ needs.prepare.outputs.version }}.tar.gz .
          cd ../..

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-standalone
          path: carsaimz-web-${{ needs.prepare.outputs.version }}.tar.gz
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Build: Android APK + AAB (Capacitor static export)
  # ---------------------------------------------------------------------------
  build-android:
    name: Build Android
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle wrapper dependencies
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" > /dev/null 2>&1 || true

      - name: Install dependencies
        run: bun install

      - name: Build static export for Capacitor
        env:
          BUILD_TARGET: capacitor
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
          NEXT_PUBLIC_FIREBASE_VAPID_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_VAPID_KEY }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          FIREBASE_ADMIN_PROJECT_ID: ${{ secrets.FIREBASE_ADMIN_PROJECT_ID }}
          FIREBASE_ADMIN_CLIENT_EMAIL: ${{ secrets.FIREBASE_ADMIN_CLIENT_EMAIL }}
          FIREBASE_ADMIN_PRIVATE_KEY: ${{ secrets.FIREBASE_ADMIN_PRIVATE_KEY }}
        run: bun run build

      - name: Verify static export
        run: |
          if [ -d "out" ] && [ "$(find out -name '*.html' | wc -l)" -gt 0 ]; then
            echo "Static export — $(find out -name '*.html' | wc -l) HTML pages generated"
          else
            echo "Static export failed — 'out' directory empty or missing"
            exit 1
          fi

      - name: Initialize Capacitor
        run: bunx cap init com.carsaimz CarsaiMZ --web-dir out || true

      - name: Add Android platform
        run: |
          if [ -d "android" ]; then
            echo "Android platform already exists — skipping add"
          else
            bunx cap add android
            if [ ! -d "android" ]; then
              echo "Android platform failed to initialize"
              exit 1
            fi
          fi

      - name: Sync Capacitor
        run: bunx cap sync android

      - name: Copy web assets
        run: bunx cap copy android

      - name: Validate AndroidManifest.xml
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ ! -f "$MANIFEST" ]; then
            echo "ERROR: AndroidManifest.xml not found"
            exit 1
          fi
          echo "AndroidManifest.xml found"

      - name: Setup keystore for signing
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "${KEYSTORE_FILE}" ] && [ -n "${KEYSTORE_PASSWORD}" ] && [ -n "${KEYSTORE_ALIAS}" ] && [ -n "${KEY_PASSWORD}" ]; then
            mkdir -p android/app/upload
            echo "${KEYSTORE_FILE}" | base64 -d > android/app/upload/release.jks
            printf 'storeFile=upload/release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
              "${KEYSTORE_PASSWORD}" "${KEYSTORE_ALIAS}" "${KEY_PASSWORD}" > android/keystore.properties
            echo "Keystore configured — builds will be signed"
          else
            echo "Signing secrets not configured — builds will be unsigned"
          fi

      - name: Build APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Build AAB with Gradle
        working-directory: android
        run: ./gradlew bundleRelease --stacktrace

      - name: Rename artifacts
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          APK_PATH=$(find android/app/build/outputs/apk/release/ -name "*.apk" -type f | head -1)
          if [ -n "$APK_PATH" ]; then
            cp "$APK_PATH" "CarsaiMozambique-${VERSION}.apk"
          fi
          AAB_PATH=$(find android/app/build/outputs/bundle/release/ -name "*.aab" -type f | head -1)
          if [ -n "$AAB_PATH" ]; then
            cp "$AAB_PATH" "CarsaiMozambique-${VERSION}.aab"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: CarsaiMozambique-${{ needs.prepare.outputs.version }}.apk
          retention-days: 30

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-aab
          path: CarsaiMozambique-${{ needs.prepare.outputs.version }}.aab
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Build: Windows Portable EXE (Electron + standalone)
  # ---------------------------------------------------------------------------
  build-windows:
    name: Build Windows
    needs: prepare
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build Next.js standalone
        env:
          BUILD_TARGET: standalone
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID }}
          NEXT_PUBLIC_FIREBASE_VAPID_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_VAPID_KEY }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          FIREBASE_ADMIN_PROJECT_ID: ${{ secrets.FIREBASE_ADMIN_PROJECT_ID }}
          FIREBASE_ADMIN_CLIENT_EMAIL: ${{ secrets.FIREBASE_ADMIN_CLIENT_EMAIL }}
          FIREBASE_ADMIN_PRIVATE_KEY: ${{ secrets.FIREBASE_ADMIN_PRIVATE_KEY }}
        run: bun run build

      - name: Verify standalone output
        shell: pwsh
        run: |
          if (Test-Path ".next\standalone\server.js") {
            Write-Host "Standalone server.js found"
          } else {
            Write-Host "Standalone server.js NOT found"
            exit 1
          }

          $staticDest = ".next\standalone\.next\static"
          if (-not (Test-Path $staticDest)) {
            Copy-Item -Path ".next\static" -Destination $staticDest -Recurse -Force
          }
          $publicDest = ".next\standalone\public"
          if (-not (Test-Path $publicDest)) {
            Copy-Item -Path "public" -Destination $publicDest -Recurse -Force
          }

      - name: Build Electron portable EXE
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          Write-Host "Running electron-builder for Windows portable..."
          bunx electron-builder --win portable

          if (Test-Path "dist") {
            Get-ChildItem -Path "dist" -Recurse -Filter "*.exe" | Select-Object FullName, Length
          } else {
            Write-Host "dist directory not found"
            exit 1
          }

      - name: Rename EXE artifact
        shell: pwsh
        run: |
          $VERSION = "${{ needs.prepare.outputs.version }}"
          $exePath = Get-ChildItem -Path "dist" -Filter "*.exe" -Recurse | Select-Object -First 1
          if ($exePath) {
            Copy-Item $exePath.FullName "CarsaiMozambique-$VERSION-Portable.exe"
            Write-Host "EXE: CarsaiMozambique-$VERSION-Portable.exe"
          } else {
            Write-Host "No EXE found in dist"
            exit 1
          }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable
          path: CarsaiMozambique-${{ needs.prepare.outputs.version }}-Portable.exe
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Create GitHub Release with changelog & assets
  # ---------------------------------------------------------------------------
  create-release:
    name: Create Release
    needs: [prepare, build-web, build-android, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded artifacts
        run: find artifacts -type f | sort

      - name: Prepare release assets
        run: |
          mkdir -p release-assets
          find artifacts -name "*.tar.gz" -exec cp {} release-assets/ \;
          find artifacts -name "*.apk" -exec cp {} release-assets/ \;
          find artifacts -name "*.aab" -exec cp {} release-assets/ \;
          find artifacts -name "*.exe" -exec cp {} release-assets/ \;
          ls -la release-assets/

      - name: Generate release body
        id: body
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          TAG="v${VERSION}"
          REPO="${{ github.repository }}"

          cat > /tmp/release-body.md << HEADER
          ## Carsai Mozambique v${VERSION}

          **Date:** $(date -u '+%Y-%m-%d %H:%M UTC')
          **Commit:** \`${{ github.sha }}\`
          HEADER

          echo "" >> /tmp/release-body.md

          # --- Downloads Section ---
          cat >> /tmp/release-body.md << 'DOWNLOADS'
          ---

          ### Downloads

          DOWNLOADS

          echo "| Platform | File | Size |" >> /tmp/release-body.md
          echo "|:---------|:-----|-----:|" >> /tmp/release-body.md

          for file in release-assets/*; do
            fname=$(basename "$file")
            fsize=$(du -h "$file" | cut -f1 | tr -d ' ')
            ext="${fname##*.}"

            case "$ext" in
              apk) icon="📱" ;;
              aab) icon="📦" ;;
              exe) icon="🖥️" ;;
              gz)  icon="🌐" ;;
              *)   icon="📁" ;;
            esac

            echo "| ${icon} ${ext^^} | [\`${fname}\`](https://github.com/${REPO}/releases/download/${TAG}/${fname}) | ${fsize} |" >> /tmp/release-body.md
          done

          echo "" >> /tmp/release-body.md

          # --- Changelog Section ---
          cat >> /tmp/release-body.md << 'CHANGELOG'
          ---

          ### Changelog

          CHANGELOG

          echo '```' >> /tmp/release-body.md
          echo "${{ needs.prepare.outputs.changelog }}" >> /tmp/release-body.md
          echo '```' >> /tmp/release-body.md

          # --- Platform Notes ---
          cat >> /tmp/release-body.md << 'NOTES'

          ---

          ### Platform Notes

          | Platform | Details |
          |:---------|:--------|
          | **Web** | Standalone Next.js server — extract and run `node server.js` |
          | **Android APK** | Direct install — enable "Install from unknown sources" |
          | **Android AAB** | App Bundle for Google Play Store upload |
          | **Windows EXE** | Portable — no installation required, just run |

          NOTES

          echo "body_file=/tmp/release-body.md" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: "Carsai Mozambique v${{ needs.prepare.outputs.version }}"
          body_path: /tmp/release-body.md
          draft: false
          prerelease: ${{ needs.prepare.outputs.is_prerelease == 'true' || contains(needs.prepare.outputs.version, '-') }}
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
